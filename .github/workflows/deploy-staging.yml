name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Before Staging Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:rules
      - run: pnpm build

  deploy:
    name: Deploy to kickpro-staging
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kickpro/shared build && pnpm --filter @kickpro/functions build

      - name: Authenticate Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Deploy Firebase Rules, Indexes, Storage & Functions
        run: |
          pnpm exec firebase use staging
          pnpm exec firebase deploy --only firestore:rules,firestore:indexes,storage,functions --non-interactive
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: staging

      - name: Trigger Firebase App Hosting Rollout (Staging)
        run: |
          pnpm exec firebase use staging
          pnpm exec firebase apphosting:rollouts:create kickpro-web --git-branch develop --non-interactive || true
